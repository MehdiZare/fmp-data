repos:
  # ───────── Core utility hooks ───────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: "^README\\.md$"
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: debug-statements
      - id: check-merge-conflict
      - id: check-docstring-first

  # ───────── Ruff (lint / fix / format) ────────────────────────────────────
  # Ruff replaces black here: black 24.x and ruff's formatter disagree on
  # assert-with-message wrapping, so running both fights over the same lines.
  # Keep this rev in sync with the ruff pin in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ───────── Bandit security scanner ──────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit
        additional_dependencies: ["bandit[toml]"]
        args: ["-c", "pyproject.toml"]
        exclude: ^tests/

  # ───────── Secret scanning ──────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: tests/.*\.py$

  # ───────── Local nox-powered helpers ────────────────────────────────────
  - repo: local
    hooks:
      - id: mypy-core
        name: "mypy: core package"
        entry: uv tool run nox -s typecheck --no-install
        language: system
        pass_filenames: false
        require_serial: true

      - id: pytest-check
        name: pytest-check
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        args: ["-q", "--tb=short", "--strict-markers", "--disable-warnings"]
