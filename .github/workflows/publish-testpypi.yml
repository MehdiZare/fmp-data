name: Publish-to-TestPyPI

on:
  # Trigger on PRs from dev to main with release labels
  pull_request:
    types: [opened, synchronize, labeled]
    branches:
      - main
  # Also trigger on pre-release tags
  push:
    tags:
      - 'v*.*.*rc*'            # Release candidates (v1.2.3rc1)
      - 'v*.*.*a*'             # Alpha releases (v1.2.3a1)
      - 'v*.*.*b*'             # Beta releases (v1.2.3b1)
      - 'v*.*.*dev*'           # Dev releases (v1.2.3dev1)

# Serialize TestPyPI publishes. Two pushes to the same PR would otherwise
# race, and the slower run's comment could overwrite the newer one --
# advertising a stale version, the exact invariant #204 exists to protect.
# Serializing (rather than cancelling) also avoids aborting an upload.
concurrency:
  group: publish-testpypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-release-build:
    # Same-repo `dev` only. Forks named `dev` must not mint a TestPyPI OIDC
    # token even if a maintainer adds a release label (#252 FMP-SEC-003).
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dev' &&
      (contains(github.event.pull_request.labels.*.name, 'release:major') ||
       contains(github.event.pull_request.labels.*.name, 'release:minor') ||
       contains(github.event.pull_request.labels.*.name, 'release:patch'))

    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.TEST_VERSION }}
      head_sha: ${{ steps.version.outputs.HEAD_SHA }}
      head_short: ${{ steps.version.outputs.HEAD_SHORT }}
    env:
      PYTHON_VERSION: "3.12"

    steps:
      - name: 🛎️  Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Needed for version calculation
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: 🐍  Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚡  Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: 📦  Install build frontend and backend (version floors)
        run: |
          uv pip install --system -r .github/requirements-build.txt

      - name: 🏷️  Calculate and create test version tag
        id: version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT_VERSION=${LATEST_TAG#v}

          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Determine version bump type from labels
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}" == "true" ]]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}" == "true" ]]; then
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          # Unique per workflow run *and* re-run attempt. A version keyed only
          # on the PR number is constant across every push to that PR, so with
          # skip-existing the first build wins forever and later green checks
          # advertise a stale artifact. See #204.
          # Encode run_id and run_attempt into a single .devN integer so
          # concatenation cannot collide (e.g. 100+11 vs 1001+1).
          DEV_N=$(( ${{ github.run_id }} * 1000 + ${{ github.run_attempt }} ))
          TEST_VERSION="${NEW_VERSION}.dev${DEV_N}"
          TEST_TAG="v${TEST_VERSION}"
          HEAD_SHA=$(git rev-parse HEAD)
          HEAD_SHORT=$(git rev-parse --short HEAD)

          {
            echo "TEST_VERSION=$TEST_VERSION"
            echo "TEST_TAG=$TEST_TAG"
            echo "HEAD_SHA=$HEAD_SHA"
            echo "HEAD_SHORT=$HEAD_SHORT"
          } >> "$GITHUB_OUTPUT"
          echo "📦 Test version: $TEST_VERSION (commit $HEAD_SHORT)"

          # Create a temporary tag for hatch-vcs to pick up and reset HEAD to it
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "$TEST_TAG" -m "Test release $TEST_TAG"

          # Force hatch-vcs to see this as the current tag by checking it out
          git checkout "$TEST_TAG"

      - name: 📦  Build wheel & sdist
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.TEST_VERSION }}
        run: |
          set -euo pipefail
          echo "🏷️ Current git state:"
          git describe --tags --always
          echo "📦 Building package..."

          python -m build --no-isolation --wheel --sdist

          echo "📦 Build completed. Contents of dist/:"
          ls -la dist/

          # Fail if the artifact version does not match what we will advertise
          # in the bot comment — otherwise green + comment can still lie.
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -eq 0 ]; then
            echo "::error::No sdist found in dist/"
            exit 1
          fi
          SDIST="${sdists[0]}"
          META_VERSION=$(tar -xOf "$SDIST" --wildcards '*/PKG-INFO' 2>/dev/null \
            | awk -F': ' '/^Version:/{print $2; exit}')
          if [ -z "${META_VERSION:-}" ]; then
            echo "::error::Could not read Version: from sdist PKG-INFO"
            exit 1
          fi
          if [ "$META_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Built version '${META_VERSION}' != expected '${EXPECTED_VERSION}'"
            exit 1
          fi
          echo "📋 Built package version matches: $META_VERSION"

          (cd dist && sha256sum ./* > ../SHA256SUMS)
          cat SHA256SUMS

      - name: 📤 Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-release-dist
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error

  test-release-publish:
    needs: test-release-build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/fmp-data/${{ needs.test-release-build.outputs.version }}/
    # Publishing credential only. `pull-requests: write` / `issues: write`
    # existed solely to post the PR comment, which now runs in its own job:
    # nothing that holds the TestPyPI OIDC token should also be able to write
    # to the repository (#252 FMP-SEC-002).
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: test-release-dist

      - name: 🔐 Verify artifact checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c ../SHA256SUMS)

      - name: 🧪  Upload to Test PyPI
        # skip-existing is intentionally OFF. With a unique version there is
        # nothing legitimate to skip; a collision must fail loudly rather than
        # report success while leaving a stale wheel installed. See #204.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: false
          verbose: true
          print-hash: true

  test-release-comment:
    # Repo-write scopes live here, isolated from the publishing credential.
    # This job never sees an OIDC token and never touches the artifact.
    needs: [test-release-build, test-release-publish]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - name: 📝  Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const version = '${{ needs.test-release-build.outputs.version }}';
            const sha = '${{ needs.test-release-build.outputs.head_sha }}';
            const short = '${{ needs.test-release-build.outputs.head_short }}';
            const comment = `## 🧪 Test Release Published

            A test version has been published to TestPyPI for verification.

            **Version:** \`${version}\`
            **Built from commit:** [\`${short}\`](${{ github.server_url }}/${{ github.repository }}/commit/${sha})

            > Each push gets a **new** TestPyPI version. Install the version in
            > this comment (not an older one) so you are verifying the code you
            > are about to release.

            ### Installation
            \`\`\`bash
            pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ fmp-data==${version}
            \`\`\`

            ### Verification Steps
            1. Install the test package using the command above
            2. Confirm \`import fmp_data; fmp_data.__version__\` matches \`${version}\`
            3. Test key functionality
            4. Check that all dependencies are resolved

            ✅ Once verified, merge this PR to trigger the actual release to PyPI.`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Test Release Published')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

  prerelease-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHON_VERSION: "3.12"

    steps:
      - name: 🛎️  Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Needed for hatch-vcs versioning
          persist-credentials: false

      - name: Require tag commit reachable from main or dev
        run: |
          set -euo pipefail
          # Fully-qualified refs only. `origin/main` is an *unqualified* rev:
          # git resolves refs/tags/<name> BEFORE refs/remotes/<name>, and
          # checkout with fetch-depth:0 mirrors every tag verbatim
          # (+refs/tags/*:refs/tags/*). A tag literally named "origin/main"
          # therefore shadowed the remote-tracking branch and this guard
          # compared HEAD against an attacker-chosen commit, passing with only
          # a "refname is ambiguous" warning. --no-tags plus an explicit
          # refspec keeps the comparison targets under refs/remotes/
          # (#252 FMP-SEC-003).
          git fetch --no-tags --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/dev:refs/remotes/origin/dev"
          HEAD="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor "$HEAD" refs/remotes/origin/main \
            || git merge-base --is-ancestor "$HEAD" refs/remotes/origin/dev; then
            echo "Tag $HEAD is reachable from origin/main or origin/dev"
          else
            echo "::error::Tag commit $HEAD is not an ancestor of origin/main or origin/dev (#252 FMP-SEC-003)"
            exit 1
          fi

      - name: 🐍  Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚡  Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: 📦  Build wheel & sdist
        run: |
          set -euo pipefail
          uv pip install --system -r .github/requirements-build.txt
          python -m build --no-isolation --wheel --sdist
          (cd dist && sha256sum ./* > ../SHA256SUMS)
          cat SHA256SUMS

      - name: 📤 Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: prerelease-dist
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error

  prerelease-publish:
    needs: prerelease-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: prerelease-dist

      - name: 🔐 Verify artifact checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c ../SHA256SUMS)

      - name: 🚀  Upload to Test PyPI
        # skip-existing OFF: a colliding prerelease tag is a real bug, not
        # a reason to advertise whatever was already on TestPyPI (#252).
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: false
