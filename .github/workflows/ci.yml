name: Test-Matrix

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: 🛎️  Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: 🐍  Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: ⚡  Install uv (with cache)
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: latest
          enable-cache: true

      - name: ▶️  Run Tests
        env:
          NOX_USE_UV: "1"
          CI: "true"
        run: |
          # Install nox first
          uv tool install nox

          # Ensure we're in the repo root
          cd "$GITHUB_WORKSPACE"

          # Run tests for each feature group with correct nox syntax
          echo "Running tests for Python ${{ matrix.python }}"

          # Use the correct parametrized session syntax with parentheses
          uv tool run nox -s "tests-${{ matrix.python }}(core)"
          uv tool run nox -s "tests-${{ matrix.python }}(langchain)"
          uv tool run nox -s "tests-${{ matrix.python }}(mcp-server)"

      - name: 🔍 Quality Gates
        if: matrix.python == '3.14'
        env:
          NOX_USE_UV: "1"
        run: |
          uv tool run nox -s lint -s typecheck -s security

  # Coverage job - run all tests in one job for simplicity
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️  Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🐍  Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: ⚡  Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: latest

      - name: 📊 Run all tests with coverage
        env:
          NOX_USE_UV: "1"
        run: |
          uv tool install nox
          uv tool run nox -s coverage_local

      - name: 📈 Coverage upload
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️  Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🐍  Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: 🔐 Install detect-secrets
        run: pip install detect-secrets

      # pragma: allowlist secret — whole-tree scan vs committed baseline
      - name: 🔍 Scan committed tree against baseline
        run: |
          set -euo pipefail
          # Fail closed on any new finding. Known dummy keys live in
          # .secrets.baseline (including tests). The previous job only
          # scanned gitignored VCR cassettes and skipped when they were
          # absent, so CI never looked at the committed tree (#252 FMP-SEC-008).
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

          CASSETTE_DIR="tests/integration/vcr_cassettes"
          if [ ! -d "$CASSETTE_DIR" ] || [ -z "$(find "$CASSETTE_DIR" -name '*.yaml' 2>/dev/null)" ]; then
            echo "No cassette YAML files present — baseline tree scan is the gate."
            exit 0
          fi

          # Cassettes are gitignored and must never contain live keys.
          detect-secrets scan \
            "$CASSETTE_DIR" \
            --exclude-files '.*\.py$' \
            > /tmp/scan-results.json

          python3 - <<'PY'
          import json, sys
          with open("/tmp/scan-results.json") as f:
              results = json.load(f)
          findings = results.get("results", {})
          total = sum(len(v) for v in findings.values())
          if total > 0:
              for path, items in findings.items():
                  for item in items:
                      line = item.get("line_number", "?")
                      stype = item.get("type", "unknown")
                      print(
                          f"::error file={path},line={line}::"
                          f"Potential credential ({stype}) found in cassette"
                      )
              sys.exit(1)
          print("No credentials detected in cassettes")
          PY

  # Fail-closed mergeability action unit matrix + shellcheck (#212).
  # Cheap (no network); runs on every PR so Guard/Release contract cannot
  # regress silently. Path-filtered would miss cross-cutting edits.
  actions-shell:
    name: Actions shell checks
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️  Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🔍 ShellCheck composite action scripts
        run: |
          set -euo pipefail
          # Fail closed: expected action scripts must exist (do not soft-pass
          # if .github/actions is empty or the mergeability harness moved).
          test -f .github/actions/check-pr-mergeable/check.sh
          test -f .github/actions/check-pr-mergeable/test-check.sh
          mapfile -t scripts < <(find .github/actions -type f -name '*.sh' | sort)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::No .github/actions/**/*.sh scripts found; shellcheck gate cannot run."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck "${scripts[@]}"

      - name: 🧪 check-pr-mergeable mock matrix
        run: bash .github/actions/check-pr-mergeable/test-check.sh

  test-matrix-expected:
    name: Test-MatrixExpected
    runs-on: ubuntu-latest
    needs: [tests, coverage, secret-scan, actions-shell]
    if: ${{ always() }}
    steps:
      - name: ✅ Verify matrix results
        run: |
          if [[ "${{ needs.tests.result }}" != "success" || "${{ needs.coverage.result }}" != "success" || "${{ needs.secret-scan.result }}" != "success" || "${{ needs.actions-shell.result }}" != "success" ]]; then
            echo "Upstream checks failed"
            exit 1
          fi
          echo "All required checks passed"
