# .github/workflows/guard-main-origin.yml
name: Guard-Main-Origin

on:
  pull_request:
    branches: [main]            # PRs whose *target* is main only

permissions:
  contents: read
  pull-requests: read

jobs:
  ensure-valid-origin:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR is from allowed branch
        env:
          # Pass through env to avoid script-injection on github.head_ref.
          BRANCH: ${{ github.head_ref }}
        run: |
          # Allow PRs from dev, hotfix, updates, or release branches
          if [[ "$BRANCH" == "dev" ]] || [[ "$BRANCH" =~ ^hotfix-.* ]] || [[ "$BRANCH" =~ ^updates-.* ]] || [[ "$BRANCH" == "release/dev-to-main" ]]; then
            echo "✅ Origin branch '$BRANCH' is allowed"
          else
            echo "::error::Main only accepts PRs from 'dev', 'hotfix-*', 'updates-*', or 'release/dev-to-main' branches. Current branch: $BRANCH"
            exit 1
          fi

      # Checkout the PR head (not the merge ref) so this job still runs when
      # the PR is CONFLICTING — the merge ref is absent then, and a default
      # checkout would fail before our fail-closed mergeability check can
      # paint a clear red X. See #202 / #210.
      - name: Checkout PR head (for local composite action)
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Fail when the PR has merge conflicts
        # A CONFLICTING PR gets no merge ref. pull_request workflows that need
        # it are simply absent from the checks list — quiet, not red — which is
        # how a release PR can look mergeable-by-default while CI never ran.
        # Turn that silent gap into a red X. Shared with Release-PR (#210).
        uses: ./.github/actions/check-pr-mergeable
        with:
          pr-number: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
