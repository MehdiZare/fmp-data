name: Dev Release

# Publishes a TestPyPI build on every push to `dev`. Distinct from
# Publish-to-TestPyPI (which only runs on labeled release PRs into main):
# this is a continuous "what's on the tip of dev" channel.
#
# Version is unique per workflow run so re-runs and force-pushes cannot
# silently re-advertise a stale wheel via skip-existing (same failure
# shape as #204).
#
# workflow_dispatch is bound to refs/heads/dev. An arbitrary ref cannot
# be published under this Trusted Publisher identity (#252 FMP-SEC-003).

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.DEV_VERSION }}
      head_short: ${{ steps.version.outputs.HEAD_SHORT }}
    env:
      PYTHON_VERSION: "3.12"

    steps:
      - name: 🛎️  Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Needed for version calculation
          fetch-tags: true
          ref: refs/heads/dev
          persist-credentials: false

      - name: 🐍  Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚡  Install uv (with cache)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: 📦  Install build frontend and backend (version floors)
        run: |
          uv pip install --system -r .github/requirements-build.txt

      - name: 🔍  Check for PR with release labels
        id: pr_labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find open PR from dev to main
          PR_JSON=$(gh pr list --head dev --base main --state open --json number,labels --limit 1)

          if [ "$PR_JSON" = "[]" ]; then
            echo "No open PR from dev to main found"
            echo "RELEASE_TYPE=minor" >> "$GITHUB_OUTPUT"
          else
            PR_NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number')
            LABELS=$(echo "$PR_JSON" | jq -r '.[0].labels[].name' 2>/dev/null || echo "")

            echo "Found PR #$PR_NUMBER with labels: $LABELS"

            if echo "$LABELS" | grep -q "release:major"; then
              echo "RELEASE_TYPE=major" >> "$GITHUB_OUTPUT"
              echo "🏷️ Release type: MAJOR"
            elif echo "$LABELS" | grep -q "release:minor"; then
              echo "RELEASE_TYPE=minor" >> "$GITHUB_OUTPUT"
              echo "🏷️ Release type: MINOR"
            elif echo "$LABELS" | grep -q "release:patch"; then
              echo "RELEASE_TYPE=patch" >> "$GITHUB_OUTPUT"
              echo "🏷️ Release type: PATCH"
            else
              echo "RELEASE_TYPE=minor" >> "$GITHUB_OUTPUT"
              echo "🏷️ Release type: minor (default)"
            fi
          fi

      - name: 🏷️  Calculate dev version
        id: version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT_VERSION=${LATEST_TAG#v}

          # Parse version components (strip any pre-release suffix)
          CURRENT_VERSION=${CURRENT_VERSION%%-*}
          CURRENT_VERSION=${CURRENT_VERSION%%+*}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # Calculate base version based on release type from PR labels
          RELEASE_TYPE="${{ steps.pr_labels.outputs.RELEASE_TYPE }}"

          if [ "$RELEASE_TYPE" = "major" ]; then
            BASE_VERSION="$((MAJOR + 1)).0.0"
          elif [ "$RELEASE_TYPE" = "patch" ]; then
            BASE_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            # Default to minor
            BASE_VERSION="${MAJOR}.$((MINOR + 1)).0"
          fi

          # Unique per run *and* re-run attempt. A version keyed only on
          # commit-count-since-tag collides on workflow re-runs and on
          # force-pushes that preserve commit count; with skip-existing
          # that advertised a stale wheel as success (#204 same shape).
          # Single .devN integer avoids run_id||run_attempt concatenation collisions.
          DEV_N=$(( ${{ github.run_id }} * 1000 + ${{ github.run_attempt }} ))
          DEV_VERSION="${BASE_VERSION}.dev${DEV_N}"
          DEV_TAG="v${DEV_VERSION}"
          HEAD_SHORT=$(git rev-parse --short HEAD)

          {
            echo "DEV_VERSION=$DEV_VERSION"
            echo "DEV_TAG=$DEV_TAG"
            echo "HEAD_SHORT=$HEAD_SHORT"
          } >> "$GITHUB_OUTPUT"
          echo "📦 Dev version: $DEV_VERSION (based on $RELEASE_TYPE release, commit $HEAD_SHORT)"

          # Create a temporary tag for hatch-vcs
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "$DEV_TAG" -m "Dev release $DEV_TAG"

      - name: 📦  Build wheel & sdist
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.DEV_VERSION }}
        run: |
          set -euo pipefail
          echo "🏷️ Current git state:"
          git describe --tags --always
          echo "📦 Building package..."

          python -m build --no-isolation --wheel --sdist

          echo "📦 Build completed. Contents of dist/:"
          ls -la dist/

          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -eq 0 ]; then
            echo "::error::No sdist found in dist/"
            exit 1
          fi
          SDIST="${sdists[0]}"
          META_VERSION=$(tar -xOf "$SDIST" --wildcards '*/PKG-INFO' 2>/dev/null \
            | awk -F': ' '/^Version:/{print $2; exit}')
          if [ -z "${META_VERSION:-}" ]; then
            echo "::error::Could not read Version: from sdist PKG-INFO"
            exit 1
          fi
          if [ "$META_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Built version '${META_VERSION}' != expected '${EXPECTED_VERSION}'"
            exit 1
          fi
          echo "📋 Built package version matches: $META_VERSION"

          (cd dist && sha256sum ./* > ../SHA256SUMS)
          cat SHA256SUMS

      - name: 📤 Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: python-package-dist
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/fmp-data/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: python-package-dist

      - name: 🔐 Verify artifact checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c ../SHA256SUMS)

      - name: 🧪  Upload to Test PyPI
        # skip-existing OFF: unique version means a collision is a real bug
        # and must fail, not silently succeed with a stale artifact.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: false
          verbose: true

      - name: 📝  Create summary
        run: |
          {
            echo "## 🧪 Dev Release Published"
            echo ""
            echo "**Version:** \`${{ needs.build.outputs.version }}\`"
            echo "**Commit:** \`${{ needs.build.outputs.head_short }}\`"
            echo ""
            echo "### Installation"
            echo "\`\`\`bash"
            echo "pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ fmp-data==${{ needs.build.outputs.version }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
