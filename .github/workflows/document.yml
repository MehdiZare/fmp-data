name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'fmp_data/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'mkdocs.yml'
      - '.github/workflows/document.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'fmp_data/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'mkdocs.yml'
      - '.github/workflows/document.yml'
  workflow_dispatch:

# Default least privilege. pages/id-token are only needed to deploy.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Cache uv dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: ${{ runner.os }}-docs-${{ hashFiles('**/pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-docs-

      - name: Install dependencies
        run: |
          echo "🚀 Installing with uv"
          uv --version

          # Generate lock file if it doesn't exist (it's gitignored)
          if [ ! -f "uv.lock" ]; then
            echo "📦 Generating uv.lock file"
            uv lock
          fi

          # Install project with docs dependencies
          uv sync --group docs

          # Install git for version detection
          echo "📦 Installing git and hatchling for versioning"
          uv pip install --system hatchling hatch-vcs

      - name: Get package version
        id: version
        run: |
          echo "📦 Getting package version"
          VERSION=$(uv run python -c "import fmp_data; print(fmp_data.__version__)")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Build documentation
        run: |
          echo "📚 Building documentation with version ${{ steps.version.outputs.VERSION }}"
          PACKAGE_VERSION="${{ steps.version.outputs.VERSION }}" uv run mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - name: Generate docs summary
        run: |
          {
            echo "## 📚 Documentation Build"
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| **Tool** | uv |"
            echo "| **Event** | ${{ github.event_name }} |"
            echo "| **Branch** | ${{ github.ref_name }} |"
            if [ -d "site" ]; then
              site_size=$(du -sh site | cut -f1)
              echo "| **Site Size** | $site_size |"
              echo "| **Status** | ✅ Built successfully |"
            else
              echo "| **Status** | ❌ Build failed |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

      - name: Generate deployment summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## 🚀 Documentation Deployed"
            echo "Documentation has been successfully deployed to GitHub Pages."
            echo ""
            echo "🔗 **[View Documentation](${PAGE_URL})**"
            echo ""
            echo "### Quick Links"
            echo "- [API Reference](${PAGE_URL}api/)"
            echo "- [Installation Guide](${PAGE_URL}installation/)"
            echo "- [Examples](${PAGE_URL}examples/)"
          } >> "$GITHUB_STEP_SUMMARY"
