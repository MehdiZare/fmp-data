name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Same-repo only, and only when the OAuth token is configured. An empty
    # secret previously made the action exit in ~400ms with is_error:true /
    # cost 0, painting every PR red without posting a review (#184).
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      secrets.CLAUDE_CODE_OAUTH_TOKEN != ''
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      # continue-on-error: an *expired* token still reaches this step (the job
      # if only sees "secret is non-empty"), and a broken review must not fail
      # the PR. Review is advisory; required checks live in ci.yml.
      - name: Run Claude Code Review
        id: claude-review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # Soft-fail is silent without this step: an expired/broken OAuth token
      # still marks the job green. Surface the outcome so maintainers notice
      # months of missing reviews (#187).
      - name: Report Claude review soft-failure
        if: always() && steps.claude-review.outcome == 'failure'
        run: |
          {
            echo "## Claude Code Review soft-failed"
            echo ""
            echo "The review step exited non-zero but the job continued"
            echo "(\`continue-on-error: true\`). Product CI in \`ci.yml\` is"
            echo "unaffected — this check is advisory."
            echo ""
            echo "### Likely causes"
            echo ""
            echo "1. **Expired or revoked** \`CLAUDE_CODE_OAUTH_TOKEN\` secret"
            echo "2. Action / plugin failure (rate limit, outage, bad prompt)"
            echo ""
            echo "### Restore the OAuth token"
            echo ""
            echo "1. Run \`claude setup-token\` (or the current Anthropic OAuth"
            echo "   flow documented for \`anthropics/claude-code-action\`)."
            echo "2. Update the repository secret"
            echo "   \`CLAUDE_CODE_OAUTH_TOKEN\` (Settings → Secrets and"
            echo "   variables → Actions)."
            echo "3. Re-run this workflow on an open PR to confirm a review"
            echo "   comment is posted."
            echo ""
            echo "See \`.github/CLAUDE_CODE_REVIEW.md\` for maintainer notes."
          } >> "$GITHUB_STEP_SUMMARY"
