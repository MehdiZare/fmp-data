name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

# Least privilege at workflow scope. Each job raises only what it needs.
# Build/tag/GitHub Release: contents: write. Publish: id-token: write only.
# Serialize releases. Two release PRs merging close together would
# otherwise race on the same tag and the same PyPI version.
# cancel-in-progress stays false: cancelling a run mid-upload is worse
# than making the second one wait (#252).
concurrency:
  group: release-to-pypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Only run if PR was merged and has a release label
    if: |
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release:major') ||
       contains(github.event.pull_request.labels.*.name, 'release:minor') ||
       contains(github.event.pull_request.labels.*.name, 'release:patch'))

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      version_number: ${{ steps.version.outputs.VERSION_NUMBER }}
    env:
      PYTHON_VERSION: "3.14"

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Fetch all history for proper versioning
          # Prefer the merge/squash commit on main so the tag points at what
          # was actually merged, not a transient pull/merge ref.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          # No persisted credentials. This job installs a PEP 517 frontend and
          # backend and then runs a build, so anything in that dependency tree
          # would otherwise be able to read a repo-write token out of
          # .git/config. The one step that needs write access pushes its tag
          # through the API with an explicitly scoped GH_TOKEN instead (#252).
          persist-credentials: false

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: false

      - name: 📦 Install build frontend and backend (version floors)
        run: |
          uv pip install --system -r .github/requirements-build.txt

      - name: 🏷️ Determine version bump type
        id: bump_type
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}" == "true" ]]; then
            echo "TYPE=major" >> "$GITHUB_OUTPUT"
            echo "Detected major version bump from PR labels"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}" == "true" ]]; then
            echo "TYPE=minor" >> "$GITHUB_OUTPUT"
            echo "Detected minor version bump from PR labels"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:patch') }}" == "true" ]]; then
            echo "TYPE=patch" >> "$GITHUB_OUTPUT"
            echo "Detected patch version bump from PR labels"
          else
            echo "::error::No release:major/minor/patch label found (job if should have prevented this)."
            exit 1
          fi

      - name: 🏷️ Get current version and calculate new version
        id: version
        run: |
          set -euo pipefail

          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Strip 'v' prefix if present; drop any local/pre-release suffix
          CURRENT_VERSION=${LATEST_TAG#v}
          CURRENT_VERSION=${CURRENT_VERSION%%-*}
          CURRENT_VERSION=${CURRENT_VERSION%%+*}
          echo "Current version: $CURRENT_VERSION"

          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # Calculate new version based on bump type
          case "${{ steps.bump_type.outputs.TYPE }}" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              ;;
            *)
              echo "::error::Unknown bump type '${{ steps.bump_type.outputs.TYPE }}'"
              exit 1
              ;;
          esac

          if [ -z "$NEW_VERSION" ]; then
            echo "::error::Calculated NEW_VERSION is empty"
            exit 1
          fi

          echo "New version: $NEW_VERSION"
          {
            echo "VERSION=v$NEW_VERSION"
            echo "VERSION_NUMBER=$NEW_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: 📋 Generate release notes from CHANGELOG
        env:
          RELEASE_TAG: ${{ steps.version.outputs.VERSION }}
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION_NUMBER }}
        run: |
          set -euo pipefail
          # Body is the matching ## [X.Y.Z] section, not the squash commit
          # list. Missing / empty section fails the job *before* the tag is
          # created or pushed, so a missing heading cannot leave a remote
          # tag with no GitHub Release / PyPI artifact (#370 leftover).
          python3 scripts/github_release_notes.py \
            --changelog CHANGELOG.md \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --out release-notes.md

          # Empty-file guard belongs here, before the local tag (#387).
          # A comment cannot satisfy the tripwire; this must execute.
          if [ ! -s release-notes.md ]; then
            echo "::error::release-notes.md is missing or empty."
            exit 1
          fi

      - name: 🏷️ Create local tag
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com

          RELEASE_TAG="${{ steps.version.outputs.VERSION }}"

          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "v" ]; then
            echo "::error::Refusing to create empty/invalid tag '$RELEASE_TAG'"
            exit 1
          fi

          # Fail loudly if the tag already exists locally. The previous
          # behaviour skipped creation, still built, and published with
          # skip-existing — a green check that re-advertised whatever was
          # already on PyPI.
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" > /dev/null; then
            echo "::error::Tag ${RELEASE_TAG} already exists. Refusing to re-release."
            echo "If this is intentional, delete the tag and re-run, or bump the version."
            exit 1
          fi

          # Create the tag locally FIRST and keep it. hatch-vcs derives the
          # version from the local tag, and the build step below runs after
          # this one -- a remote-only tag would silently produce a .devN
          # version instead of the release version. The remote tag is pushed
          # only after the build and sdist version check succeed.
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          echo "Created local tag ${RELEASE_TAG}"

      - name: 📦 Build distribution
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.VERSION_NUMBER }}
        run: |
          set -euo pipefail
          python -m build --no-isolation --wheel --sdist
          echo "Built artifacts:"
          ls -la dist/

          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -eq 0 ]; then
            echo "::error::No sdist found in dist/"
            exit 1
          fi
          SDIST="${sdists[0]}"
          # Read PKG-INFO in full first. `tar | awk ... exit` under pipefail
          # dies with tar's SIGPIPE (exit 2) after awk closes the pipe — the
          # sdist is fine, the job is not.
          PKG_INFO=$(tar -xOf "$SDIST" --wildcards '*/PKG-INFO')
          META_VERSION=$(awk -F': ' '/^Version:/{print $2; exit}' <<<"$PKG_INFO")
          if [ -z "${META_VERSION:-}" ]; then
            echo "::error::Could not read Version: from sdist PKG-INFO"
            exit 1
          fi
          if [ "$META_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Built version '${META_VERSION}' != expected '${EXPECTED_VERSION}'"
            exit 1
          fi
          echo "📋 Built package version matches: $META_VERSION"

          (cd dist && sha256sum ./* > ../SHA256SUMS)
          cat SHA256SUMS

      - name: 🏷️ Push tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ steps.version.outputs.VERSION }}"

          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "v" ]; then
            echo "::error::Refusing to push empty/invalid tag '$RELEASE_TAG'"
            exit 1
          fi

          # Publish it through the API rather than `git push`: the checkout no
          # longer persists credentials, so there is no git remote auth. Two
          # calls keep the remote tag *annotated*, matching the local one --
          # creating the ref alone would leave a lightweight tag.
          COMMIT_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          TAG_SHA="$(gh api "repos/${REPO}/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="Release $RELEASE_TAG" \
            -f object="$COMMIT_SHA" \
            -f type=commit \
            --jq .sha)"
          gh api "repos/${REPO}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$TAG_SHA" > /dev/null

          # Confirm the remote actually has it before anything downstream
          # relies on it (`gh release create --verify-tag` would fail later
          # and less legibly).
          gh api "repos/${REPO}/git/ref/tags/${RELEASE_TAG}" > /dev/null
          echo "Pushed tag ${RELEASE_TAG} -> ${COMMIT_SHA}"

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail

          if [ ! -s release-notes.md ]; then
            echo "::error::release-notes.md is missing or empty."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::GitHub Release $RELEASE_TAG already exists. Refusing to overwrite."
            exit 1
          fi

          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "Release $RELEASE_TAG" \
            --notes-file release-notes.md

      - name: 📤 Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-package-dist
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fmp-data/${{ needs.build.outputs.version_number }}/
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-dist

      - name: 🔐 Verify artifact checksums
        run: |
          set -euo pipefail
          # SHA256SUMS was written from inside dist/, so verify there.
          (cd dist && sha256sum -c ../SHA256SUMS)
          ls -la dist

      - name: 🚀 Publish to PyPI
        # skip-existing OFF for real releases. A collision means the version
        # is already on PyPI; reporting success while leaving that older
        # artifact installed is the same silent-success class as #204.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: false
